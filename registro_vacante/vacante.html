<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style_v.css">

    <title>TalentFlow IA - Registrar Vacante</title>
</head>

<body>

    <header class="header" id="header">
        <h1 class="header__titulo">
            TalentFlow IA
        </h1>
    </header>


    <form action="" class="form" id="formulario">

        <h2 class="form__titulo">
            Registrar nueva vacante
        </h2>


        <!-- TÍTULO -->

        <div class="form__labels">

            <label for="titulo" class="form__label">
                Título de la Vacante
            </label>

            <label for="year_experiencia" class="form__label">
                Años de Experiencia
            </label>

        </div>


        <div class="form__inputs">

            <input
                type="text"
                id="titulo"
                name="titulo"
                class="form__input"
                placeholder="Ej: Desarrollador Backend Junior"
                required
            >

            <input
                type="number"
                id="year_experiencia"
                name="year_experiencia"
                class="form__input"
                placeholder="Ej: 1"
                min="0"
                required
            >

        </div>


        <!-- HABILIDADES -->

        <div class="form__labels">

            <label for="hab_requeridas" class="form__label form__label--full">
                Habilidades requeridas
            </label>

        </div>


        <div class="form__inputs form__inputs--full">

            <input
                type="text"
                id="hab_requeridas"
                name="hab_requeridas"
                class="form__input form__input--full"
                placeholder="Ej: Java, Spring Boot, SQL, Git, Docker"
                required
            >

        </div>


        <p class="form__ayuda">
            Separa las habilidades utilizando comas.
        </p>


        <button type="submit" class="form__button" id="boton">
            Registrar Vacante
        </button>

    </form>


    <script src="app_v.js"></script>

</body>

</html>
